apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gemma-chat
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: git@github.com:WarunaUdara/sovereign-llm-platform.git
    targetRevision: main
    path: deploy/gemma-chat
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-serving
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
