# Runtime secret injection for the model. Values live in Secret Manager; the GKE CSI driver mounts them
# into the pod as files, using the pod's Workload Identity (no key). The metrics token is also synced to a
# Kubernetes Secret, because PodMonitoring reads it from the namespace.
# Note: secretObjects (syncing into a Kubernetes Secret) is not used: the GKE-managed CSI driver
# is forbidden from listing Secrets cluster-wide on this cluster, so the sync fails. Files are read directly.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: model-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/40427773756/secrets/llm-api-keys/versions/latest"
        fileName: "api-keys"
      - resourceName: "projects/40427773756/secrets/llm-metrics-token/versions/latest"
        fileName: "metrics-token"
