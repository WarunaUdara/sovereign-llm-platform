apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-endpoint
  labels:
    app.kubernetes.io/name: model-endpoint
  annotations:
    # Workload Identity: reads llm-api-keys and llm-metrics-token only.
    iam.gke.io/gcp-service-account: llm-lab-model-secrets@llm-k8s-experimental.iam.gserviceaccount.com
# No API token is mounted. The model server never talks to the Kubernetes API.
automountServiceAccountToken: false
