# Google Managed Prometheus scrapes llama-server through PodMonitoring. The scraper authenticates with
# the dedicated metrics token (Secret llm-metrics-token), never the inference key.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: model-endpoint
  namespace: llm-serving
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: model-endpoint
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      authorization:
        type: Bearer
        credentials:
          secret:
            name: llm-metrics-token
            key: token
---
# The managed collector runs in gmp-system. Allow only that namespace to reach the model's metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-metrics-from-gmp
  namespace: llm-serving
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: model-endpoint
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - {protocol: TCP, port: 8080}
