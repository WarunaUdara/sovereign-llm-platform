# Chat model: Gemma 4 E2B instruct (QAT Q4_0, Apache-2.0) on the pinned llama.cpp runtime.
# The chat endpoint points here. Selected by the grounding and chat gates (docs/PLAN-V3, section 7).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gemma-chat
  labels: {app.kubernetes.io/name: gemma-chat, app.kubernetes.io/part-of: sovereign-llm}
  annotations:
    # Workload Identity: reads the inference key only (ADR 0012).
    iam.gke.io/gcp-service-account: llm-lab-model-secrets@llm-k8s-experimental.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-chat
  labels: {app.kubernetes.io/name: gemma-chat, app.kubernetes.io/part-of: sovereign-llm}
spec:
  # Two replicas, spread across nodes (ADR 0015). Required before the old node pool can be removed.
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector:
    matchLabels: {app.kubernetes.io/name: gemma-chat}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gemma-chat, app.kubernetes.io/part-of: sovereign-llm}
    spec:
      serviceAccountName: gemma-chat
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gemma-chat
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: llama-server
          image: gemma-chat:v1   # overlay pins the digest
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --model
            - /models/gemma-4-E2B_q4_0-it.gguf
            - --alias
            - gemma-4-e2b-it
            - --api-key-file
            - /etc/llm/api-keys/api-keys
            - --ctx-size
            - "8192"
            - --parallel
            - "2"
            - --n-predict
            - "512"
            - --cache-ram
            - "256"
            - --no-webui
            # Gemma 4 reasons before answering by default; that doubles latency and can exhaust max_tokens
            # before any visible answer. Direct answers are the product behaviour here.
            - --chat-template-kwargs
            - '{"enable_thinking":false}'
            - --timeout
            - "300"
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: "1", memory: 3Gi}
            limits: {cpu: "3", memory: 4608Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
          volumeMounts:
            - {name: api-keys, mountPath: /etc/llm/api-keys, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: api-keys
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: gemma-secrets
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
# The inference key only, from Secret Manager, through this pod's Workload Identity (ADR 0012).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gemma-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/40427773756/secrets/llm-api-keys/versions/latest"
        fileName: "api-keys"
---
apiVersion: v1
kind: Service
metadata:
  name: gemma-chat
  labels: {app.kubernetes.io/name: gemma-chat, app.kubernetes.io/part-of: sovereign-llm}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: gemma-chat}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gemma-chat-ingress-from-chat
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gemma-chat}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: chat}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grounded-chat}
      ports:
        - {protocol: TCP, port: 8080}
  egress: []
