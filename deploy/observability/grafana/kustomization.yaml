apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - grafana.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: grafana-provisioning
    files:
      - provisioning/datasources.yaml
      - provisioning/dashboards.yaml
    options:
      disableNameSuffixHash: true
  - name: grafana-dashboards
    files:
      - dashboards/sovereign-llm.json
    options:
      disableNameSuffixHash: true
images:
  - name: grafana:13.2.5-distroless
    newName: us-central1-docker.pkg.dev/llm-k8s-experimental/llm-lab-images/grafana
    digest: sha256:53e52b5b1f0a596593169b9fc0a598f8a63dbbd0168a00f3e839ba65bcd07098
