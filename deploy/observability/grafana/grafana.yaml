# Grafana: dashboards as code. Datasource and dashboards are provisioned from ConfigMaps; no internet, no plugins.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: sovereign-llm}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: sovereign-llm}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: sovereign-llm}
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472        # the grafana user in the distroless image
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          # Digest-pinned mirror of grafana/grafana:13.2.5-distroless (see images/images.lock.yaml).
          image: grafana:13.2.5-distroless
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: GF_SERVER_HTTP_PORT, value: "3000"}
            - {name: GF_SERVER_ROOT_URL, value: "http://localhost:3000"}
            - {name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning}
            - {name: GF_PATHS_DATA, value: /var/lib/grafana}
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_USERS_DEFAULT_THEME, value: dark}
            # No outbound calls: this cluster has no internet route.
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED, value: "false"}
            # The background installer retries plugin downloads from grafana.com, which this cluster cannot
            # reach. Each attempt costs memory on a tight pod; preinstall is off because the dashboard is
            # provisioned from a ConfigMap and needs no plugins.
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            # 384Mi was too small: the container was OOMKilled (exit 137) while rendering the dashboard.
            # Idle is about 234Mi; the limit leaves headroom for query caching and the in-memory index.
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 500m, memory: 896Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
            # The Prometheus plugin writes its socket under /tmp. Root FS is read-only, so /tmp is an explicit volume.
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items:
              - {key: datasources.yaml, path: datasources/datasources.yaml}
              - {key: dashboards.yaml, path: dashboards/dashboards.yaml}
        - name: dashboards
          configMap:
            name: grafana-dashboards
        # Dashboards are code, so the database is disposable. Emptied on every restart by design.
        - name: data
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: sovereign-llm}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
