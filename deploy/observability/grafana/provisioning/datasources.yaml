apiVersion: 1
datasources:
  - name: Managed Prometheus (sovereign-llm)
    uid: gmp
    type: prometheus
    access: proxy
    # The Managed Prometheus frontend (gmp-public). Read-only; Workload Identity on its side.
    url: http://frontend.gmp-public.svc.cluster.local:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
