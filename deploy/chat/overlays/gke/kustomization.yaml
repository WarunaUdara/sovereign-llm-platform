apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chat
resources:
  - ../../base
  - ../../../gateway
  - ../../../network
# Digests come from images/images.lock.yaml (mirrored into Artifact Registry). Never a mutable tag.
images:
  - name: librechat:v0.8.8
    newName: us-central1-docker.pkg.dev/llm-k8s-experimental/llm-lab-images/librechat
    digest: sha256:5b706bcee1ca154a1e2987303aaeca0eb27f97919cccee4bb604226c2f8abf61
  - name: mongo:8.0.20
    newName: us-central1-docker.pkg.dev/llm-k8s-experimental/llm-lab-images/mongo
    digest: sha256:098862b1339f031900ca66cf8fef799e616d6324fa41b9a263f2ec899552c1ef
  - name: redis:8.2.3-alpine
    newName: us-central1-docker.pkg.dev/llm-k8s-experimental/llm-lab-images/redis
    digest: sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
patches:
  - target: {kind: ConfigMap, name: librechat-env}
    patch: |-
      - op: replace
        path: /data/DOMAIN_CLIENT
        value: https://chat.example.com
      - op: replace
        path: /data/DOMAIN_SERVER
        value: https://chat.example.com
