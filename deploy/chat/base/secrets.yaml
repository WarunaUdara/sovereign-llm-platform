# Runtime secret injection for LibreChat. Values come from Secret Manager through the GKE CSI driver, using
# the librechat pod's Workload Identity. secretObjects syncs them into the librechat-secrets Secret that the
# Deployment reads as environment variables, so the application config does not change.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: chat-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/40427773756/secrets/librechat-creds-key/versions/latest"
        fileName: "CREDS_KEY"
      - resourceName: "projects/40427773756/secrets/librechat-creds-iv/versions/latest"
        fileName: "CREDS_IV"
      - resourceName: "projects/40427773756/secrets/librechat-jwt-secret/versions/latest"
        fileName: "JWT_SECRET"
      - resourceName: "projects/40427773756/secrets/librechat-jwt-refresh/versions/latest"
        fileName: "JWT_REFRESH_SECRET"
      - resourceName: "projects/40427773756/secrets/llm-inference-key/versions/latest"
        fileName: "LLM_API_KEY"
