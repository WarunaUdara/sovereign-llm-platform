# Public front door: GKE Gateway on a global external Application Load Balancer.
# TLS terminates here with a Google-managed certificate (Certificate Manager map). HTTP is redirected to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: chat-edge
  namespace: chat
  annotations:
    networking.gke.io/certmap: llm-lab-edge-certmap
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: llm-lab-edge-ip        # reserved in OpenTofu, so the sslip.io hostname is known in advance
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: chat.example.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      hostname: chat.example.com
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-https
  namespace: chat
spec:
  parentRefs:
    - name: chat-edge
      sectionName: https
  hostnames: ["chat.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: librechat
          port: 3080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-http-redirect
  namespace: chat
spec:
  parentRefs:
    - name: chat-edge
      sectionName: http
  hostnames: ["chat.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
